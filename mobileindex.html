<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>朝阳十班_beta-手机版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, sans-serif;
        }
        html {
            scroll-behavior: smooth;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f7f8fa;
            padding-bottom: 80px;
        }
        a {
            text-decoration: none;
            color: #222;
        }
        ul, li {
            list-style: none;
        }

        /* 顶部头部横幅 */
        .mobile-header {
            background: #2554b8;
            color: #fff;
            padding: 18px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }

        /* 内容容器通用边距 */
        .container {
            width: 94%;
            margin: 16px auto;
        }

        /* 功能卡片模块 */
        .card-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0;
        }
        .func-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 16px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .func-card:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        /* 校徽图片容器 */
        .logo-img-box{
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            padding:12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .logo-img-box img{
            width:100%;
            display:block;
        }

        /* 底部常驻导航栏 */
        .mobile-footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #fff;
            display: flex;
            border-top: 1px solid #e5e7eb;
            z-index: 999;
        }
        .footer-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #555;
            transition: color 0.2s;
        }
        .footer-nav-item.active {
            color: #2554b8;
        }
    </style>
    <!-- 引入和电脑端同一个登录JS，保证 ClassLogin 全局方法可用 -->
    <script src="./js/login.js"></script>
</head>
<body id="page-top">
    <!-- 顶部标题栏 -->
    <header class="mobile-header">
        朝阳十班_beta-手机版
    </header>

    <div class="container">
        <!-- 快捷功能卡片区 -->
        <div class="card-group">
            <a href="/login" class="func-card" id="userCard">登录</a>
            <a href="/game/phonehall" class="func-card">游戏中心</a>
        </div>

        <!-- 班徽图片 -->
        <div class="logo-img-box">
            <img src="/static/assets/img/photo.png" alt="班徽">
        </div>
    </div>

    <!-- 更新通知区域 -->
    <main class="container">
        <div style="background:#fff;padding:20px;border-radius:12px;">
            <h3>更新通知</h3>
            <p style="margin-top:10px;color:#666;line-height:1.7;">
                2026-8暑假更新：<br>
                1. 优化了页面加载速度和用户体验<br>
                2. 新增功能模块：游戏中心、讨论版<br>
                3. 修复现有已知Bug<br>
                4. 重构手机端界面，大幅提升移动端使用体验
            </p>
        </div>
    </main>

    <!-- 底部固定导航 -->
    <nav class="mobile-footer-nav">
        <a href="#page-top" class="footer-nav-item active">首页</a>
        <a href="/massage/phonemain" class="footer-nav-item">讨论版</a>
        <a href="/game/phonehall" class="footer-nav-item">游戏中心</a>
        <a href="/index" class="footer-nav-item">电脑版</a>
    </nav>

    <footer id="footer" class="container" style="margin-top:40px;text-align:center;color:#888;font-size:13px;">
        朝阳十班_beta-手机版
    </footer>

    <!-- 手机端登录状态逻辑 -->
    <script>
        const loginInfo = window.ClassLogin?.getLogin();
        const userBox = document.getElementById("userCard");

        if (!loginInfo) {
            userBox.innerText = "登录";
            userBox.href = "./login.html";
        } else {
            userBox.innerText = loginInfo.userName;
            userBox.href = "javascript:void(0)";
            userBox.onclick = function () {
                if (confirm("确认退出当前账号吗？")) {
                    window.ClassLogin.logout();
                }
            }
        }
    </script>
</body>
</html>
