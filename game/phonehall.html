
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>游戏中心_beta-手机版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, sans-serif;
        }
        html {
            scroll-behavior: smooth;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f7f8fa;
            padding-bottom: 80px;
        }
        a {
            text-decoration: none;
            color: #222;
        }
        ul, li {
            list-style: none;
        }

        /* 顶部头部横幅 */
        .mobile-header {
            background: #2554b8;
            color: #fff;
            padding: 18px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }

        /* 内容容器通用边距 */
        .container {
            width: 94%;
            margin: 16px auto;
        }

        /* 功能卡片模块 */
        .card-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0;
        }
        .func-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 16px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .func-card:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        /* 校徽图片容器 */
        .logo-img-box{
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            padding:12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .logo-img-box img{
            width:100%;
            display:block;
        }

        /* 底部常驻导航栏 */
        .mobile-footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #fff;
            display: flex;
            border-top: 1px solid #e5e7eb;
            z-index: 999;
        }
        .footer-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #555;
            transition: color 0.2s;
        }
        .footer-nav-item.active {
            color: #2554b8;
        }
    </style>
    <style>

    li{border-bottom:1px solid #d0d7e3}
    li:last-child{border-bottom:none}
    a{display:block;padding:16px 20px;color:#111;text-decoration:none;font-size:17px;transition:background 0.2s}
    a:hover{background:#eef4ff}
    </style>
</head>
